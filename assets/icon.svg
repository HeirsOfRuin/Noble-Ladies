<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- An illuminated initial S, for Saint-Pol: a blue field in a gold frame on the rubric red, as a book of hours opens a page. -->
  <rect width="64" height="64" fill="#7a1f2b"/>
  <rect x="8" y="8" width="48" height="48" rx="3" fill="#2b4a7a" stroke="#d4a94a" stroke-width="3"/>
  <rect x="12.5" y="12.5" width="39" height="39" rx="1.5" fill="none" stroke="#d4a94a" stroke-width="0.8"/>
  <g fill="#f3ead6" opacity=".9"><circle cx="17" cy="17" r="1.4"/><circle cx="47" cy="17" r="1.4"/><circle cx="17" cy="47" r="1.4"/><circle cx="47" cy="47" r="1.4"/></g>
  <text x="32" y="45.5" font-family="Georgia,'Times New Roman',serif" font-size="36" font-weight="700" text-anchor="middle" fill="#f3ead6">S</text>
</svg>
